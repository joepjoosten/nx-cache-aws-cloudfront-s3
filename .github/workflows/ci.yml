name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bucket_region: [us-east-1, eu-west-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Synthesize CDK deployment with throwaway tokens
        run: |
          npm run configure -- ci-fixture "${{ matrix.bucket_region }}"
          npm run build
          npm run synth -- --quiet --no-lookups
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate CloudFormation schema
        run: |
          python -m pip install cfn-lint==1.59.0
          cfn-lint dist/templates/*.template.json
